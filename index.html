<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#13a538" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Light Game" />
  <meta name="description" content="A full-screen red, yellow, green light game with manual and unpredictable auto modes." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Red Light, Green Light</title>
  <style>
    :root { font-family: system-ui, -apple-system, sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #13a538; }
    #screen { position: fixed; inset: 0; background: #13a538; display: flex; align-items: center; justify-content: center; transition: background-color .12s linear; }
    #word { font-size: clamp(4rem, 17vw, 14rem); line-height: 1; font-weight: 1000; letter-spacing: -.06em; color: white; text-shadow: 0 4px 20px #0005; pointer-events: none; user-select: none; }
    #screen.yellow #word { color: #171717; text-shadow: none; }
    #toolbar { position: fixed; z-index: 5; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(96%, 580px); padding: 16px; background: rgba(18, 23, 30, .93); border: 1px solid #ffffff3b; border-radius: 22px; color: #fff; box-shadow: 0 10px 35px #0005; transition: opacity .2s, transform .2s; }
    #toolbar.hidden { opacity: 0; pointer-events: none; transform: translate(-50%, 20px); }
    .row { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
    button { border: 0; border-radius: 12px; min-height: 48px; padding: 10px 15px; font-size: 16px; font-weight: 800; cursor: pointer; touch-action: manipulation; }
    .color { flex: 1; min-width: 75px; }
    .red { background: #ed3131; color: #fff; } .yellow { background: #ffdc24; color: #111; } .green { background: #15b34a; color: #fff; }
    .utility { background: #e7ebf0; color: #171b20; } .utility.active { background: #9dd5ff; }
    .row + .row { margin-top: 10px; }
    .setting { margin-top: 12px; display: flex; align-items: center; gap: 10px; font-size: 14px; justify-content: space-between; }
    input[type=range] { flex: 1; min-width: 80px; accent-color: #9dd5ff; }
    #hint { position: fixed; z-index: 2; top: max(12px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; color: #fff; font-size: 14px; font-weight: 650; opacity: .75; pointer-events: none; text-shadow: 0 1px 3px #0008; transition: opacity .2s; }
    #hint.gone { opacity: 0; }
    button:focus-visible, input:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    @media (max-height: 450px) { #toolbar { padding: 9px; bottom: 8px; } button { min-height: 38px; padding: 6px 10px; } .setting { margin-top: 6px; } }
  </style>
</head>
<body>
  <main id="screen" role="img" aria-label="Green light"><div id="word">GO!</div></main>
  <div id="hint">Tap anywhere to show or hide controls</div>
  <section id="toolbar" aria-label="Game controls">
    <div class="row">
      <button class="color red" data-color="red">RED</button>
      <button class="color yellow" data-color="yellow">YELLOW</button>
      <button class="color green" data-color="green">GREEN</button>
    </div>
    <div class="row">
      <button id="auto" class="utility" aria-pressed="false">▶ Start Auto</button>
      <button id="fullscreen" class="utility">⛶ Full Screen</button>
      <button id="hide" class="utility">Hide Controls</button>
    </div>
    <label class="setting" for="speed"><span>Change frequency</span><input id="speed" type="range" min="1" max="5" value="3" step="1" /><span id="speedLabel">Normal</span></label>
  </section>
  <script src="script.js" defer></script>
</body>
</html>
